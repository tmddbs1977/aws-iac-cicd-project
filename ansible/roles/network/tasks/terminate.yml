# 1. VPC ID 조회 (이름 기준)
- name: Get VPC ID
  amazon.aws.ec2_vpc_net_info:
    region: "{{ region }}"
    filters:
      "tag:Name": "{{ prefix }}-vpc"
  register: vpc_info

- name: Set VPC ID Fact
  set_fact:
    target_vpc_id: "{{ vpc_info.vpcs[0].id }}"
  when: vpc_info.vpcs | length > 0

# 2. Route Tables 삭제
- name: Remove Route Tables
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    state: absent
    lookup: tag
    tags:
      Name: "{{ item }}"
  loop: ["{{ prefix }}-pub-rt", "{{ prefix }}-pri-rt"]
  when: target_vpc_id is defined
  ignore_errors: yes

# 3. NAT Gateway ID 조회
- name: Get NAT Gateway Info
  amazon.aws.ec2_vpc_nat_gateway_info:
    region: "{{ region }}"
    filters:
      "tag:Name": "{{ prefix }}-ngw"
      state: ["available"]
  register: nat_gw_info

# 3-1. NAT Gateway 삭제 (EIP 포함)
- name: Remove NAT Gateway
  amazon.aws.ec2_vpc_nat_gateway:
    state: absent
    region: "{{ region }}"
    nat_gateway_id: "{{ nat_gw_info.result[0].nat_gateway_id }}"
    wait: yes
    release_eip: yes
  when: nat_gw_info.result | length > 0

# 4. Subnets 삭제
- name: Remove Subnets
  amazon.aws.ec2_vpc_subnet:
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    state: absent
    cidr: "{{ item.cidr }}"
  loop: "{{ pub_subnets + pri_subnets }}"

# 5. IGW 삭제
- name: Remove IGW
  amazon.aws.ec2_vpc_igw:
    vpc_id: "{{ target_vpc_id }}"
    region: "{{ region }}"
    state: absent

# 6. VPC 삭제
- name: Remove VPC
  amazon.aws.ec2_vpc_net:
    name: "{{ prefix }}-vpc"
    cidr_block: "{{ vpc_cidr }}"
    region: "{{ region }}"
    state: absent