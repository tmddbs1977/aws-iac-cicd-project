---
- name: CodeDeploy Management
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml

  tasks:
    - name: Deploy CodeDeploy
      include_role:
        name: codedeploy
      when: action == "deploy"

    - name: Terminate CodeDeploy
      include_role:
        name: codedeploy
        tasks_from: terminate
      when: action == "terminate"
